name: chud_iptv
description: "Lecteur IPTV local : playlists M3U et Xtream Codes."
publish_to: 'none'

version: 0.5.6+12

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  http: ^1.6.0
  crypto: ^3.0.8
  file_selector: ^1.1.0
  package_info_plus: ^10.2.2
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  cryptography: ^2.9.0
  url_launcher: ^6.3.3
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  # Génère AppLocalizations à partir de lib/l10n/*.arb (voir l10n.yaml).
  generate: true

  # Polices sous licence SIL Open Font License (fichiers OFL dans assets/fonts).
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
